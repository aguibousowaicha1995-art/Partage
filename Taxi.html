</style></head><body><div id="app"></div>
<script>

const PL={Kaloum:[9.509,-13.712],Almamya:[9.523,-13.705],Dixinn:[9.545,-13.675],Madina:[9.560,-13.662],Matoto:[9.555,-13.615],Gbessia:[9.577,-13.612],Kipé:[9.585,-13.630],Cosa:[9.590,-13.640],Lambanyi:[9.615,-13.610]},PN=Object.keys(PL);
const km=(a,b)=>{const A=Array.isArray(a)?a:PL[a],C=Array.isArray(b)?b:PL[b],r=x=>x*Math.PI/180,q=Math.sin(r(C[0]-A[0])/2)**2+Math.cos(r(A[0]))*Math.cos(r(C[0]))*Math.sin(r(C[1]-A[1])/2)**2;return Math.max(.5,12742*Math.asin(Math.sqrt(q))*1.3).toFixed(1)};
const price=(t,k)=>{const c=S.cfg[t==='Moto'?'m':'v'];return Math.round((c[0]+c[1]*k)*(1+(S.surge?S.cfg.s:0)/100)/1000)*1000};
const LM={'Marché de Madina':[9.5605,-13.664],'Aéroport de Gbessia':[9.5769,-13.6119],'Palais du Peuple':[9.5077,-13.7089],'Port autonome':[9.5135,-13.717],'Stade du 28 Septembre':[9.5335,-13.6900],'Station Total Kipé':[9.5850,-13.6305],'Carrefour Cosa':[9.5905,-13.6395],'Marché Matoto':[9.5555,-13.6150]};

const tel=ph=>B('📞 Appeler (numéro masqué)','callM()','s');
function callM(){MOD=`<h2>📞 Appel via l'application</h2><p>Mise en relation en cours… Votre numéro et celui de l'autre personne restent cachés.</p>${B('Fermer','close()')}`;L('📞 Appel masqué lancé');render()}
function share(id){MOD=`<h2>🔗 Partager mon trajet</h2><p>Envoyez ce lien à un proche : il suit la course en direct.</p><input readonly value="https://courses.exemple.gn/suivi/${id.toUpperCase()}"><p class="mu">Lien simulé.</p>${B('Copier et fermer','close()')}`;L('🔗 Trajet partagé avec '+((me().tc||[]).length?me().tc.length+' contact(s) de confiance':'un proche'));render()}
const nearName=pt=>PN.reduce((b,n)=>+km(pt,n)<+km(pt,b)?n:b,PN[0]);
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(()=>{o.frequency.value=1175},180);setTimeout(()=>{o.stop();a.close()},420)}catch(x){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}

function seed(){return{users:[
{id:'a1',role:'admin',name:'Administrateur',phone:'622000000',st:'ok'},
{id:'c1',role:'client',name:'Awa Diop',phone:'622111111',city:'Conakry',st:'ok',w:100000,hx:[{h:'Démo',l:'Solde initial',a:100000,b:100000}]},
{id:'c2',role:'client',name:'Fatou Camara',phone:'622555555',city:'Conakry',st:'ok',w:50000,hx:[{h:'Démo',l:'Solde initial',a:50000,b:50000}]},
{id:'d1',role:'driver',name:'Mamadou Bah',phone:'622222222',city:'Conakry',permis:'PC-4521',cg:'CG-9981',veh:{t:'Moto',m:'Yamaha 125',p:'RC 1234 A'},exp:{permis:iso(700),assur:iso(10)},st:'ok',w:0,on:true},
{id:'d2',role:'driver',name:'Alpha Diallo',phone:'622333333',city:'Conakry',permis:'PC-7788',cg:'CG-1204',veh:{t:'Voiture',m:'Toyota Corolla',p:'RC 5678 B'},exp:{permis:iso(500),assur:iso(300)},st:'ok',w:0,on:true}],rides:[],reports:[],refunds:[],tickets:[],payouts:[],log:[],rev:0,cfg:{m:[5000,2500],v:[10000,6000],c:12,w:5,f:5000,s:20,t:10000,mh:10,rh:6}}}

let cur='client',MOD='',PAY={},OV=false;const D={client:{},driver:{},admin:{}};

function avg(id){const r=S.rides.map(x=>x.d===id?x.rc:x.c===id?x.rp:null).filter(Boolean);return r.length?{a:(r.reduce((s,x)=>s+x.n,0)/r.length).toFixed(1),n:r.length}:{a:'–',n:0}}
const stars=id=>{const r=avg(id);return `★ ${r.a} <span class="mu">(${r.n})</span>`};
const LB={req:['Recherche de chauffeur','a'],acc:['Chauffeur en route','g'],arr:['Chauffeur arrivé','g'],go:['En course','g'],done:['Terminée – paiement','a'],cash:['Paiement en espèces','a'],paid:['Payée','g'],can:['Annulée','r']};

if(d==='client'){const r=active(u);return r&&r.st==='done'?1:0}
const r=active(u);return r?(['acc','arr','go','cash'].includes(r.st)?1:0):(u.on?S.rides.filter(x=>x.st==='req'&&x.o===u.id).length:0)}
const screenFor=d=>{const o=cur;cur=d;const h=screen();cur=o;return h};
function render(){$('app').style.maxWidth=OV?'1200px':'420px';const N={client:'👤 Client',driver:'🏍️ Chauffeur',admin:'🛡️ Admin'};
$('app').innerHTML=`<div class="row sp"><b>🛵 Courses Guinée</b>${B('▶ Démo','demo()','o')}${B(NET?'📶 Réseau':'📵 Coupé','net()',NET?'s':'d')}${D.client.u&&D.driver.u&&D.admin.u?B(OV?'1 écran':'3 écrans','OV=!OV;render()','s'):''}${B('Réinit.',"if(confirm('Tout effacer ?')){S=seed();save();for(const k in D)D[k]={};MOD='';OV=false;render()}",'s')}</div>
${NET?'':`<div class="card"><span class="tag r">📵 Pas de réseau</span> <span class="mu">Vos actions (${Q.length}) partiront dès le retour de la connexion.</span></div>`}<div class="tabs">${Object.keys(N).map(d=>`<button class="${d===cur?'on':''}" onclick="cur='${d}';MOD='';render()">${N[d]}${todo(d)?`<i class="dot">${todo(d)}</i>`:''}</button>`).join('')}</div>
${OV?`<div class="ov">${Object.keys(N).map(d=>`<div onpointerdown="cur='${d}'"><b>${N[d]}</b><div class="phone"><div class="scr">${screenFor(d)}</div></div></div>`).join('')}</div>`:`<div class="phone"><div class="scr">${screen()}</div></div>`}<div class="mod" style="display:${MOD?'flex':'none'}"><div>${MOD}</div></div>
<h2>Journal en direct</h2><div class="card mu">${S.log.map(e).join('<br>')||'Aucun événement.'}</div>`}

function demo(){S=seed();const t=new Date().toLocaleString('fr-FR');
S.users.push({id:'c3',role:'client',name:'Ousmane Sylla',phone:'622777777',city:'Conakry',idt:'CNI',idn:'CN-4412',st:'pending'},{id:'d3',role:'driver',name:'Sekou Traoré',phone:'622666666',city:'Conakry',permis:'PC-3300',cg:'CG-5566',veh:{t:'Moto',m:'Haojue 150',p:'RC 9012 C'},st:'pending',w:0,on:false});

{id:'r2',c:'c2',d:null,from:'Madina',to:'Cosa',km:km('Madina','Cosa'),price:price('Moto',km('Madina','Cosa')),ty:'Moto',st:'req'});

U('d1').w=['r1','r3'].reduce((a,id)=>a+Math.round(R(id).price*(100-S.cfg.c)/100),0);U('d1').bias=60;S.rides.filter(r=>r.st==='req').forEach(r=>{r.q=buildQueue(r);r.dec=[];offerNext(r);r.fix=1});L('Démo chargée');D.client={u:'c1'};D.driver={u:'d1'};D.admin={u:'a1'};MOD='';OV=true;save();render()}

/* ---------- Authentification ---------- */
function screen(){const d=dv(),u=me();if(!u)return auth(d);
return `<div class="row sp"><div><b>${e(u.name)}</b><div class="mu">${u.role==='driver'?e(u.veh.t)+' '+e(u.veh.p)+' · ':''}${u.role==='admin'?'Administrateur':stars(u.id)}</div></div><span class="row">${u.role!=='admin'?B('🛟 Aide','help()','s'):''}${B('Quitter',"D[cur]={};render()",'s')}</span></div>`+(cur==='client'?wal(u)+safeC(u)+cView():cur==='driver'?dView():aView())}

MOD=`<h2>Paiement · ${fmt(r.price)}</h2><div class="pay">${['Orange Money','MTN MoMo','Carte bancaire','Espèces'].map((m,i)=>`<label><input type="radio" name="m" value="${m}" ${i?'':'checked'} onchange="PAY.m=this.value;$('pn').style.display=this.value==='Espèces'?'none':'block';$('pn').placeholder=this.value==='Carte bancaire'?'N° de carte (16 chiffres)':'N° de téléphone'">${['🟠','🟡','💳','💵'][i]} ${m}</label>`).join('')}</div>
<input id="pn" placeholder="N° de téléphone"><label class="mu"><input class="chk" type="checkbox" id="fl"> Simuler un échec (solde insuffisant)</label>
<p class="mu">Commission ${S.cfg.c} % : ${fmt(r.price*S.cfg.c/100)}. Test carte : 4242 4242 4242 4242</p><div class="row">${B('Payer','pay2()','o')}${B('Fermer','close()','s')}</div>`;render()}
function pay2(){const n=PAY.ok?PAY.n:($('pn').value||'').trim();if(!PAY.ok)PAY.f=$('fl').checked;
if(PAY.m==='Espèces')return go(()=>{R(PAY.id).st='cash';MOD='';L('💵 '+R(PAY.id).from+' → '+R(PAY.id).to+' : paiement en espèces choisi')});
if(PAY.m==='Carte bancaire'&&!luhn(n))return alert('Numéro de carte invalide.');
if(PAY.m!=='Carte bancaire'&&!okTel(n))return alert('Numéro invalide : 9 chiffres commençant par 6.');
if(PAY.m!=='Carte bancaire'&&!PAY.ok){PAY.n=n;MOD=`<h2>📱 Vérifiez le numéro</h2><p>La demande de paiement sera envoyée au :</p><b style="font-size:26px">+224 ${fT(n)}</b><p class="mu">${PAY.m}</p><div class="row">${B('✏️ Modifier',`pay('${PAY.id}')`,'s')}${B('✅ Oui, c\'est mon numéro','PAY.ok=1;pay2()','o')}</div>`;return render()}
MOD=`<h2>${PAY.m==='Carte bancaire'?'🔐 3D Secure':'📱 Demande envoyée au '+e(n)}</h2><p>${PAY.m==='Carte bancaire'?'Code reçu par SMS de votre banque : 123456':'Saisissez votre code secret '+PAY.m}</p><input id="pin" inputmode="numeric" maxlength="6" placeholder="Code"><div class="row">${B('Valider','pay3()','o')}${B('Annuler','close()','s')}</div>`;render()}
function pay3(){if(!$('pin').value.trim())return;MOD='<h2>⏳ Traitement en cours…</h2>';render();
setTimeout(()=>{if(PAY.f){MOD=`<h2>❌ Paiement refusé</h2><p>Solde insuffisant. Aucun montant débité.</p><div class="row">${B('Réessayer',`pay('${PAY.id}')`)}${B('Fermer','close()','s')}</div>`;L('Paiement refusé ('+PAY.m+')');return render()}
const r=R(PAY.id),c=Math.round(r.price*S.cfg.c/100);r.st='paid';r.method=PAY.m;r.ref='TX'+uid().toUpperCase();r.pd=new Date().toLocaleString('fr-FR');r.ts=Date.now();S.rev+=c;mv(U(r.d),r.price-c,'Course '+r.from+' → '+r.to);
L(U(r.c).name+' a payé '+fmt(r.price)+' via '+PAY.m);save();MOD=`<h2>✅ Paiement réussi</h2><p>Réf. ${r.ref}<br>${fmt(r.price)} via ${PAY.m}</p>${B('Fermer','close()')}`;render()},1400)}
function cashOk(id){go(()=>{const r=R(id),c=Math.round(r.price*S.cfg.c/100);r.st='paid';r.method='Espèces';r.pd=new Date().toLocaleString('fr-FR');r.ts=Date.now();S.rev+=c;mv(U(r.d),-c,'Commission (course payée en espèces)');L('💵 Espèces reçues '+fmt(r.price)+' (commission '+fmt(c)+' prélevée sur le solde du chauffeur)')})}

/* ---------- Notes, SOS, signalements ---------- */
let rv=0,tip=0;
function rate(id){rv=0;tip=0;MOD=`<h2>Votre note</h2><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button onclick="rv=${i};[...$('st').children].forEach((b,k)=>b.textContent=k<rv?'★':'☆')">☆</button>`).join('')}</div><div class="row" id="tg" style="margin:6px 0">${['👍 Ponctuel','👍 Conduite prudente','👍 Véhicule propre','👍 Aimable','👎 Retard','👎 Conduite dangereuse','👎 Comportement'].map(t=>B(t,"this.className=this.className==='s'?'':'s'",'s')).join('')}</div><textarea id="rt" rows="2" placeholder="Commentaire"></textarea>${cur==='client'?`<p class="mu">💝 Pourboire pour le chauffeur (100 % pour lui, sans commission)</p><div class="row" id="tp">${[0,5000,10000,20000].map(v=>B(v?fmt(v):'Aucun',`tip=${v};[...$('tp').children].forEach(b=>b.className='s');this.className=''`,v?'s':'')).join('')}</div>`:''}<div class="row">${B('Publier',`doRate('${id}')`)}${B('Fermer','close()','s')}</div>`;render()}
function doRate(id){if(!rv)return alert('Choisissez une note.');if(cur==='client'&&tip&&R(id).method==='Portefeuille'&&(me().w||0)<tip)return alert('Solde insuffisant pour le pourboire : rechargez votre portefeuille.');go(()=>{const r=R(id),o={n:rv,t:[...$('tg').children].filter(b=>b.className==='').map(b=>b.textContent).concat($('rt').value||[]).join(' · ')};if(cur==='client'){r.rc=o;if(tip){r.tip=tip;if(r.method==='Portefeuille')mv(U(r.c),-tip,'Pourboire à '+U(r.d).name);if(r.method!=='Espèces')U(r.d).w+=tip;L('💝 Pourboire de '+fmt(tip)+' pour '+U(r.d).name)}}else r.rp=o;MOD='';L(me().name+' a donné '+rv+'★')})}
function report(id){MOD=`<h2>Signaler un incident</h2><select id="rs"><option>Comportement dangereux</option><option>Agression / menace</option><option>Arnaque sur le prix</option><option>Véhicule non conforme</option><option>Autre</option></select><textarea id="rd" rows="3" placeholder="Que s'est-il passé ?"></textarea><div class="row">${B('Envoyer à l\'équipe',`doRep('${id}')`,'d')}${B('Fermer','close()','s')}</div>`;render()}
function doRep(id){const r=R(id),a=cur==='client'?r.d:r.c;go(()=>{S.reports.push({id:uid(),by:me().id,against:a,reason:$('rs').value,text:$('rd').value,st:'open'});MOD='';L('🚩 Incident signalé contre '+U(a).name)})}
function sos(id){const r=R(id);if(!confirm('Envoyer une alerte sécurité à l\'équipe ?'))return;go(()=>{S.reports.push({id:uid(),by:r.c,against:r.d,reason:'🆘 ALERTE SÉCURITÉ (pendant la course)',text:'Course '+r.from+' → '+r.to+', statut : '+LB[r.st][0],st:'open'});L('🆘 ALERTE SÉCURITÉ déclenchée par '+U(r.c).name);if((U(r.c).tc||[]).length)L('📩 '+U(r.c).tc.length+' contact(s) de confiance prévenus avec la position')})}

/* ---------- Admin ---------- */
function aView(){const d=dv();d.tab=d.tab||'stat';const pend=S.users.filter(u=>u.st==='pending'),reps=S.reports.filter(r=>r.st==='open');
const T=[['stat','Stats'],['ver','Vérif.'+(pend.length?' ('+pend.length+')':'')],['rep','Incidents'+(reps.length?' ('+reps.length+')':'')],['drv','Chauffeurs'],['ref','Remb.'+(S.refunds.some(f=>f.st==='open')?' ('+S.refunds.filter(f=>f.st==='open').length+')':'')],['usr','Comptes'],['cfg','Réglages'],['pay','Paie'],['sup','Support'+(S.tickets.some(t=>!t.rep)?' ('+S.tickets.filter(t=>!t.rep).length+')':'')]];
const tabs=`<div class="tabs">${T.map(t=>`<button class="${d.tab===t[0]?'on':''}" onclick="dv().tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
if(d.tab==='stat'){const p=S.rides.filter(r=>r.st==='paid');return tabs+`<div class="g2"><div class="card"><b>${S.users.filter(u=>u.st==='ok'&&u.role==='driver').length}</b><div class="mu">Chauffeurs actifs</div></div><div class="card"><b>${p.length}</b><div class="mu">Courses payées</div></div><div class="card"><b>${fmt(p.reduce((s,r)=>s+r.price,0))}</b><div class="mu">Volume</div></div><div class="card"><b>${fmt(S.rev)}</b><div class="mu">Commissions</div></div></div>`}
if(d.tab==='ver')return tabs+(pend.map(u=>`<div class="card"><b>${e(u.name)}</b> ${u.veh?`<span class="tag">${e(u.veh.t)}</span><div class="mu">${e(u.phone)} · ${e(u.city)}<br>${e(u.veh.m)} · plaque ${e(u.veh.p)}<br>Permis ${e(u.permis)} · Carte grise ${e(u.cg)}<br>📷 permis ✅ · 📷 carte grise ✅ · 📷 véhicule ✅ · 🤳 selfie ✅ · 📋 casier ✅</div>`:`<span class="tag">Client</span><div class="mu">${e(u.phone)} · ${e(u.city)}<br>${e(u.idt)} n° ${e(u.idn)}<br>📷 pièce ✅ · 🤳 selfie ✅</div>`}<div class="row" style="margin-top:6px">${B('Valider',`setU('${u.id}','ok')`)}${B('Rejeter',`setU('${u.id}','rejected')`,'s')}</div></div>`).join('')||'<p class="mu">Rien à vérifier.</p>');
if(d.tab==='rep')return tabs+(reps.map(r=>{const a=U(r.against);return `<div class="card"><b>${e(a.name)}</b> <span class="tag r">${e(r.reason)}</span><div>${e(r.text)}</div><div class="mu">Par ${e(U(r.by).name)} · note ${stars(a.id)}</div><div class="row" style="margin-top:6px">${B('Bloquer',`blk('${r.id}','${a.id}')`,'d')}${B('Classer',`go(()=>{S.reports.find(x=>x.id==='${r.id}').st='closed'})`,'s')}</div></div>`}).join('')||'<p class="mu">Aucun incident.</p>');
if(d.tab==='pay'){const t=S.cfg.t??10000,ds=S.users.filter(u=>u.role==='driver'&&u.st!=='blocked').map(u=>({u,c:calc(u)})).filter(x=>x.c.net!==0||x.c.n),el=ds.filter(x=>x.c.net>=t),tot=el.reduce((a,x)=>a+x.c.net,0);
return tabs+`<div class="card"><b>Semaine en cours</b><div class="mu">Seuil : ${fmt(t)} · envoi vers le numéro mobile money enregistré du chauffeur</div></div>`+ds.map(x=>`<div class="card"><div class="row sp"><b>${e(x.u.name)}</b><span class="tag ${x.c.net>=t?'g':x.c.net<0?'r':'a'}">${x.c.net>=t?'À payer':x.c.net<0?'Solde négatif':'Reporté'}</span></div><div class="mu">${x.c.n} course(s) · +224 ${fT(x.u.phone)}</div>${lines(x.c)}</div>`).join('')+(el.length?`<div class="card"><b>Total à envoyer : ${fmt(tot)}</b> <span class="mu">(${el.length} chauffeur(s))</span><label class="mu" style="display:block;margin:6px 0"><input class="chk" type="checkbox" id="pf"> Simuler un échec d'envoi pour le premier chauffeur</label>${B('✅ Valider et envoyer','runPay()','o')}</div>`:'<p class="mu">Aucun paiement à envoyer (seuil non atteint).</p>')+'<h2>Historique des paiements</h2>'+(S.payouts.map(p=>`<div class="card"><b>${e(p.at)}</b> · ${fmt(p.items.filter(i=>i.st==='sent').reduce((a,i)=>a+i.net,0))} envoyés${p.items.map(i=>`<div class="row sp mu" style="margin-top:4px"><span>${e(U(i.d).name)} · ${fmt(i.net)} · ${i.ref}</span><span class="row"><span class="tag ${i.st==='sent'?'g':'r'}">${i.st==='sent'?'envoyé':'échoué'}</span>${i.st==='failed'?B('Renvoyer',`retryPay('${p.id}','${i.d}')`,'s'):''}</span></div>`).join('')}</div>`).join('')||'<p class="mu">Aucun paiement effectué.</p>')}
if(d.tab==='sup')return tabs+(S.tickets.filter(t=>!t.rep).map(t=>`<div class="card"><b>${e(U(t.by).name)}</b> <span class="tag">${U(t.by).role}</span><div>${e(t.text)}</div><input id="ar${t.id}" placeholder="Votre réponse">${B('Répondre',`answer('${t.id}')`)}</div>`).join('')||'<p class="mu">Aucune demande.</p>');
if(d.tab==='ref')return tabs+(S.refunds.filter(f=>f.st==='open').map(f=>{const r=R(f.ride);return `<div class="card"><b>${e(U(f.by).name)}</b> <span class="tag a">${e(f.reason)}</span><div>${e(f.text)}</div><div class="mu">${r.from} → ${r.to} · ${fmt(r.price)} · ${r.method} · chauffeur ${e(U(r.d).name)} ${stars(r.d)}</div><div class="row" style="margin-top:6px">${B('Rembourser 100 %',`decRef('${f.id}',100)`)}${B('50 %',`decRef('${f.id}',50)`,'s')}${B('Refuser',`decRef('${f.id}',0)`,'s r')}</div></div>`}).join('')||'<p class="mu">Aucune demande de remboursement.</p>');
if(d.tab==='drv')return tabs+(S.users.filter(u=>u.role==='driver'&&['ok','suspended'].includes(u.st)).map(u=>{const a=avg(u.id),n=S.rides.filter(r=>r.d===u.id&&r.st==='paid').length,low=+a.a<3&&a.n>=3,soon=docs(u).some(x=>dleft(x[1])<30);return `<div class="card"><div class="row sp"><b>${e(u.name)}</b><span class="tag ${u.st==='ok'?'g':'r'}">${u.st==='ok'?'actif':'suspendu'}</span></div><div class="mu">${e(u.veh.t)} ${e(u.veh.p)} · ${n} course(s) · acceptation ${u.of?Math.round((u.ac||0)/u.of*100):100} % · ${stars(u.id)}${low?' <span class="tag r">note basse</span>':''}</div><div class="row" style="margin:4px 0">${docs(u).map(x=>dtag(x)).join('')}</div>${u.ren?.length?`<div class="mu">📷 Nouveau document reçu : ${u.ren.join(', ')}</div>`:''}<div class="row">${u.ren?.length?B('Valider le document',`renew('${u.id}')`):soon?B('🔔 Relancer',`relance('${u.id}')`,'s'):''}${u.st==='ok'?B('Suspendre',`setU('${u.id}','suspended')`,'s r'):B('Réactiver',`setU('${u.id}','ok')`)}</div></div>`}).join('')||'<p class="mu">Aucun chauffeur.</p>');
if(d.tab==='cfg'){const c=S.cfg,I=(i,v)=>`<input id="cf${i}" type="number" value="${v}" style="flex:1">`;return tabs+`<div class="card"><h2>Tarifs (GNF)</h2><label class="mu">Moto : prise en charge / par km</label><div class="row">${I(1,c.m[0])}${I(2,c.m[1])}</div><label class="mu">Voiture : prise en charge / par km</label><div class="row">${I(3,c.v[0])}${I(4,c.v[1])}</div><label class="mu">Commission de la plateforme (%)</label><input id="cf5" type="number" value="${c.c}"><label class="mu">Attente gratuite (minutes) · frais d'annulation / client absent (GNF)</label><div class="row">${I(6,c.w)}${I(7,c.f)}</div><label class="mu">Majoration forte demande / pluie (%)</label>${I(8,c.s)}<label class="mu">Seuil de paiement hebdomadaire (GNF)</label>${I(9,c.t)}<label class="mu">Pause obligatoire : heures en ligne maximum · heures de repos</label><div class="row">${I(10,c.mh)}${I(11,c.rh)}</div><div class="row" style="margin:6px 0">${B(S.surge?'⚡ Majoration ACTIVE (désactiver)':'Activer la majoration',"go(()=>{S.surge=!S.surge;L('⚡ Majoration '+(S.surge?'activée':'désactivée'))})",S.surge?'d':'s')}</div><p class="mu">Les courses déjà demandées gardent leur prix.</p>${B('Enregistrer','saveCfg()')}</div>`}
return tabs+S.users.filter(u=>u.role!=='admin').map(u=>`<div class="card"><div class="row sp"><b>${e(u.name)}</b><span class="tag ${u.st==='ok'?'g':u.st==='pending'?'a':'r'}">${u.st}</span></div><div class="mu">${u.role==='driver'?e(u.veh.t)+' '+e(u.veh.p):'Client'} · ${stars(u.id)}</div><div style="margin-top:6px">${u.st==='blocked'?B('Débloquer',`setU('${u.id}','ok')`,'s'):u.st==='ok'?B('Bloquer',`setU('${u.id}','blocked')`,'s r'):''}</div></div>`).join('')}
function saveCfg(){const v=i=>+$('cf'+i).value;if([1,2,3,4,6,7,8,9,11].some(i=>v(i)<0)||v(10)<1||v(5)<0||v(5)>50)return alert('Valeurs invalides (commission entre 0 et 50 %).');go(()=>{S.cfg={m:[v(1),v(2)],v:[v(3),v(4)],c:v(5),w:v(6),f:v(7),s:v(8),t:v(9),mh:v(10),rh:v(11)};L('Admin : tarifs et commission mis à jour')})}
const setU=(id,s)=>go(()=>{U(id).st=s;if(s!=='ok')U(id).on=false;L('Admin : '+U(id).name+' → '+s)});
const blk=(rid,id)=>go(()=>{U(id).st='blocked';U(id).on=false;S.reports.filter(r=>r.against===id).forEach(r=>r.st='closed');L('⛔ '+U(id).name+' bloqué')});
render();
setInterval(()=>{const a=document.activeElement;if(!MOD&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},5000);
setInterval(()=>{const a=document.activeElement,ty=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName),ch=tickDispatch();if((ch||S.rides.some(r=>r.st==='req'&&r.o&&D.driver.u===r.o))&&!MOD&&!ty)render()},1000);
</script></body></html>
