<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mon budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf4f0;
  --surface: #ffffff;
  --ink: #10261f;
  --muted: #587068;
  --line: #d3e1da;
  --ok: #0c7a55;
  --ok-ink: #ffffff;
  --over: #c2410c;
  --danger: #c2321f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1512; --surface: #14231e; --ink: #e9f5ef; --muted: #8fa89e;
    --line: #23382f; --ok: #3ecf95; --ok-ink: #0b1512; --over: #ff9a5c; --danger: #ff8a78;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1512; --surface: #14231e; --ink: #e9f5ef; --muted: #8fa89e;
  --line: #23382f; --ok: #3ecf95; --ok-ink: #0b1512; --over: #ff9a5c; --danger: #ff8a78;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
}
main { max-width: 520px; margin: 0 auto; padding: 16px 16px 56px; }
.display { font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, sans-serif; }

.months { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.months h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-transform: capitalize; }
.nav {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 22px; cursor: pointer; line-height: 1;
}

.hero { background: var(--ok); color: var(--ok-ink); border-radius: 28px; padding: 22px 22px 20px; }
.hero.over { background: var(--over); }
.hero .label { font-size: 15px; font-weight: 600; opacity: .9; }
.hero .amount { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 4px 0 12px; overflow-wrap: anywhere; }
.hero .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,.3); overflow: hidden; }
:root[data-theme="dark"] .hero .bar { background: rgba(11,21,18,.25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .bar { background: rgba(11,21,18,.25); } }
.hero .bar i { display: block; height: 100%; width: 0; background: var(--ok-ink); border-radius: 999px; transition: width .35s ease; }
.hero .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 14px; font-weight: 600; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-top: 14px; }
.card h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.01em; }
.card .headrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card .headrow h2 { margin: 0; }
.ghost {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}

.field { display: flex; gap: 8px; margin-top: 10px; }
input[type="text"], input[type="date"], input[inputmode] {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px;
}
.primary {
  font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 13px 18px;
  background: var(--ink); color: var(--bg); cursor: pointer;
}

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); border-radius: 16px; padding: 5px; }
.seg button {
  border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700;
  border-radius: 12px; padding: 11px 8px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink) inset; }

.cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; }
.cat {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg);
  color: var(--ink); border-radius: 999px; padding: 8px 13px; font: inherit; font-size: 14px; cursor: pointer;
}
.cat i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.track { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; }
.breakdown { display: grid; gap: 12px; }
.brow .top { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 5px; }
.brow .top b { font-variant-numeric: tabular-nums; }
.budgetline { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.budgetline b { color: var(--ink); }

.exp { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.exp:first-of-type { border-top: 0; }
.exp .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
.exp .mid { flex: 1; min-width: 0; }
.exp .title { font-weight: 600; overflow-wrap: anywhere; }
.exp .sub { font-size: 13px; color: var(--muted); }
.exp .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.exp .val.in { color: var(--ok); }
.exp .x {
  flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; color: var(--danger); font-size: 18px; cursor: pointer; line-height: 1;
}
.empty { color: var(--muted); margin: 0; }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ok); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="months">
    <button class="nav" id="prev" aria-label="Mois précédent">‹</button>
    <h1 class="display" id="monthTitle"></h1>
    <button class="nav" id="next" aria-label="Mois suivant">›</button>
  </div>

  <section class="hero" id="hero" aria-live="polite">
    <div class="label">Solde du mois</div>
    <div class="amount display" id="heroAmount">0 $</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="meta"><span id="totIn"></span><span id="totOut"></span></div>
  </section>

  <section class="card">
    <h2 class="display">Ajouter un mouvement</h2>
    <div class="seg" role="group" aria-label="Type de mouvement">
      <button type="button" id="segOut" aria-pressed="true">Sortie</button>
      <button type="button" id="segIn" aria-pressed="false">Rentrée</button>
    </div>
    <div class="cats" id="catPicker" role="group" aria-label="Catégorie"></div>
    <div class="field">
      <input id="amount" type="text" inputmode="decimal" placeholder="Montant ($)" aria-label="Montant en dollars">
      <input id="date" type="date" aria-label="Date">
    </div>
    <div class="field">
      <input id="note" type="text" maxlength="40" placeholder="Note (facultatif)" aria-label="Note">
      <button class="primary" id="addExp">Ajouter</button>
    </div>
  </section>

  <section class="card">
    <div class="headrow">
      <h2 class="display">Budget des sorties</h2>
      <button class="ghost" id="setBudget">Définir</button>
    </div>
    <div id="budgetEdit" hidden>
      <div class="field" style="margin-top:0;margin-bottom:12px">
        <input id="budgetInput" type="text" inputmode="decimal" placeholder="Ex. 1200" aria-label="Plafond de sorties en dollars">
        <button class="primary" id="saveBudget">Enregistrer</button>
      </div>
    </div>
    <div id="budgetInfo"></div>
  </section>

  <section class="card">
    <h2 class="display">Sorties par catégorie</h2>
    <div class="breakdown" id="breakdown"></div>
  </section>

  <section class="card">
    <h2 class="display">Mouvements du mois</h2>
    <div id="expenses"></div>
  </section>

  <p class="note">Vos données restent sur cet appareil, dans ce navigateur.</p>
</main>

<script>
(function () {
  var KEY = "budget-v1";
  var CATS_OUT = [
    { id: "courses", name: "Courses", color: "#0c7a55" },
    { id: "transport", name: "Transport", color: "#2f6bff" },
    { id: "logement", name: "Logement", color: "#8a5cf6" },
    { id: "loisirs", name: "Loisirs", color: "#e6a100" },
    { id: "sante", name: "Santé", color: "#e0457b" },
    { id: "autre", name: "Autre", color: "#6b7f78" }
  ];
  var CATS_IN = [
    { id: "salaire", name: "Salaire", color: "#0c7a55" },
    { id: "prime", name: "Prime", color: "#2f6bff" },
    { id: "remboursement", name: "Remboursement", color: "#8a5cf6" },
    { id: "autre_in", name: "Autre rentrée", color: "#6b7f78" }
  ];
  // Les anciennes données (sans "type") sont des sorties.
  var state = { budgets: {}, expenses: [] };
  var view = new Date(); view.setDate(1);
  var mode = "out";
  var selCat = "courses";

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          state.budgets = d.budgets || {};
          state.expenses = Array.isArray(d.expenses) ? d.expenses : [];
        }
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function dayKey(d) { return monthKey(d) + "-" + pad(d.getDate()); }
  function usd(n, dec) {
    return new Intl.NumberFormat("fr-FR", {
      minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: 2 }).format(n) + "\u00a0$";
  }
  function parseAmount(s) {
    var n = parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
    return isFinite(n) ? n : NaN;
  }
  function isIn(x) { return x.type === "in"; }
  function catOf(id) {
    var all = CATS_OUT.concat(CATS_IN);
    return all.filter(function (c) { return c.id === id; })[0] || CATS_OUT[CATS_OUT.length - 1];
  }
  function budgetFor(mk) {
    var keys = Object.keys(state.budgets).filter(function (k) { return k <= mk; }).sort();
    return keys.length ? state.budgets[keys[keys.length - 1]] : 0;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var mk = monthKey(view);
    document.getElementById("monthTitle").textContent =
      view.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

    var list = state.expenses.filter(function (x) { return x.date.slice(0, 7) === mk; })
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.id > a.id ? 1 : -1); });
    var tIn = 0, tOut = 0;
    list.forEach(function (x) { if (isIn(x)) tIn += x.amount; else tOut += x.amount; });
    var solde = tIn - tOut;

    // Solde
    document.getElementById("hero").classList.toggle("over", solde < 0);
    document.getElementById("heroAmount").textContent = (solde < 0 ? "\u2212" : "") + usd(Math.abs(solde), true);
    document.getElementById("barFill").style.width =
      tIn > 0 ? Math.min(100, tOut / tIn * 100) + "%" : (tOut > 0 ? "100%" : "0%");
    document.getElementById("totIn").textContent = "+ " + usd(tIn, true) + " rentrées";
    document.getElementById("totOut").textContent = "\u2212 " + usd(tOut, true) + " sorties";

    // Budget des sorties
    var budget = budgetFor(mk);
    var bi = document.getElementById("budgetInfo");
    bi.textContent = "";
    document.getElementById("setBudget").textContent = budget > 0 ? "Modifier" : "Définir";
    if (budget <= 0) {
      bi.appendChild(el("p", "empty", "Fixez un plafond pour suivre vos sorties du mois."));
    } else {
      var track = el("div", "track");
      var fill = el("i");
      fill.style.width = Math.min(100, tOut / budget * 100) + "%";
      fill.style.background = tOut > budget ? "var(--over)" : "var(--ok)";
      track.appendChild(fill);
      bi.appendChild(track);
      var line = el("div", "budgetline");
      var left = budget - tOut;
      var l1 = el("span");
      l1.appendChild(el("b", null, usd(Math.abs(left), true)));
      l1.appendChild(document.createTextNode(left < 0 ? " de dépassement" : " restants sur " + usd(budget)));
      line.appendChild(l1);
      var now = new Date();
      if (left > 0 && monthKey(now) === mk) {
        var dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
        line.appendChild(el("span", null, "≈ " + usd(left / (dim - now.getDate() + 1), true) + " par jour"));
      }
      bi.appendChild(line);
    }

    // Sorties par catégorie
    var bd = document.getElementById("breakdown");
    bd.textContent = "";
    var byCat = {};
    list.forEach(function (x) { if (!isIn(x)) byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
    var used = CATS_OUT.filter(function (c) { return byCat[c.id]; })
      .sort(function (a, b) { return byCat[b.id] - byCat[a.id]; });
    if (!used.length) {
      bd.appendChild(el("p", "empty", "Aucune sortie ce mois-ci."));
    } else {
      var max = byCat[used[0].id];
      used.forEach(function (c) {
        var row = el("div", "brow");
        var top = el("div", "top");
        top.appendChild(el("span", null, c.name));
        top.appendChild(el("b", null, usd(byCat[c.id], true)));
        var tr = el("div", "track");
        var f = el("i");
        f.style.width = (byCat[c.id] / max * 100) + "%";
        f.style.background = c.color;
        tr.appendChild(f);
        row.appendChild(top); row.appendChild(tr);
        bd.appendChild(row);
      });
    }

    // Liste des mouvements
    var ex = document.getElementById("expenses");
    ex.textContent = "";
    if (!list.length) {
      ex.appendChild(el("p", "empty", "Aucun mouvement ce mois-ci. Ajoutez une rentrée ou une sortie ci-dessus."));
    } else {
      list.forEach(function (x) {
        var c = catOf(x.cat);
        var row = el("div", "exp");
        var dot = el("span", "dot"); dot.style.background = c.color;
        var mid = el("div", "mid");
        mid.appendChild(el("div", "title", x.note || c.name));
        var d = new Date(x.date + "T12:00:00");
        mid.appendChild(el("div", "sub", c.name + " · " + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })));
        var val = el("div", "val" + (isIn(x) ? " in" : ""), (isIn(x) ? "+ " : "\u2212 ") + usd(x.amount, true));
        var del = el("button", "x", "×");
        del.type = "button";
        del.setAttribute("aria-label", "Supprimer ce mouvement");
        del.addEventListener("click", function () {
          if (!window.confirm("Supprimer ce mouvement de " + usd(x.amount, true) + " ?")) return;
          state.expenses = state.expenses.filter(function (y) { return y.id !== x.id; });
          save(); render();
        });
        row.appendChild(dot); row.appendChild(mid); row.appendChild(val); row.appendChild(del);
        ex.appendChild(row);
      });
    }
  }

  function renderCats() {
    var cats = mode === "in" ? CATS_IN : CATS_OUT;
    var box = document.getElementById("catPicker");
    box.textContent = "";
    cats.forEach(function (c) {
      var b = el("button", "cat");
      b.type = "button";
      var i = el("i"); i.style.background = c.color;
      b.appendChild(i);
      b.appendChild(document.createTextNode(c.name));
      b.setAttribute("aria-pressed", c.id === selCat ? "true" : "false");
      b.addEventListener("click", function () { selCat = c.id; renderCats(); });
      box.appendChild(b);
    });
    document.getElementById("segOut").setAttribute("aria-pressed", mode === "out" ? "true" : "false");
    document.getElementById("segIn").setAttribute("aria-pressed", mode === "in" ? "true" : "false");
  }
  function setMode(m) {
    mode = m;
    selCat = (m === "in" ? CATS_IN : CATS_OUT)[0].id;
    renderCats();
  }
  document.getElementById("segOut").addEventListener("click", function () { setMode("out"); });
  document.getElementById("segIn").addEventListener("click", function () { setMode("in"); });

  function defaultDate() {
    var now = new Date();
    if (monthKey(now) === monthKey(view)) return dayKey(now);
    return monthKey(view) + "-01";
  }
  document.getElementById("prev").addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    document.getElementById("date").value = defaultDate(); render();
  });
  document.getElementById("next").addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    document.getElementById("date").value = defaultDate(); render();
  });

  var be = document.getElementById("budgetEdit");
  document.getElementById("setBudget").addEventListener("click", function () {
    be.hidden = !be.hidden;
    if (!be.hidden) {
      var cur = budgetFor(monthKey(view));
      var inp = document.getElementById("budgetInput");
      inp.value = cur ? String(cur) : "";
      inp.focus();
    }
  });
  document.getElementById("saveBudget").addEventListener("click", function () {
    var n = parseAmount(document.getElementById("budgetInput").value);
    if (isNaN(n) || n < 0) { window.alert("Entrez un montant valide, par exemple 1200."); return; }
    state.budgets[monthKey(view)] = n;
    save(); be.hidden = true; render();
  });

  function addItem() {
    var n = parseAmount(document.getElementById("amount").value);
    if (isNaN(n) || n <= 0) { window.alert("Entrez un montant supérieur à 0, par exemple 12,50."); return; }
    var date = document.getElementById("date").value || defaultDate();
    state.expenses.push({
      id: "e" + Date.now() + Math.floor(Math.random() * 1000),
      type: mode,
      amount: Math.round(n * 100) / 100,
      cat: selCat,
      date: date,
      note: document.getElementById("note").value.trim()
    });
    save();
    document.getElementById("amount").value = "";
    document.getElementById("note").value = "";
    var d = new Date(date + "T12:00:00");
    if (monthKey(d) !== monthKey(view)) view = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  }
  document.getElementById("addExp").addEventListener("click", addItem);
  ["amount", "note"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });
  });

  load();
  renderCats();
  document.getElementById("date").value = defaultDate();
  render();
})();
</script>
</body>
</html>
