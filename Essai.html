<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dépenses partagées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f1fa;
  --surface: #ffffff;
  --ink: #1c1a3a;
  --muted: #64628a;
  --line: #dedcf0;
  --accent: #ff8a1f;
  --accent-ink: #1c1a3a;
  --plus: #0f766e;
  --minus: #c2410c;
  --danger: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12112a; --surface: #1c1a3a; --ink: #eeecff; --muted: #a9a7d0;
    --line: #2f2c57; --accent: #ffa64d; --accent-ink: #12112a;
    --plus: #4fd1c5; --minus: #ff9d6b; --danger: #ff8a80;
  }
}
:root[data-theme="dark"] {
  --bg: #12112a; --surface: #1c1a3a; --ink: #eeecff; --muted: #a9a7d0;
  --line: #2f2c57; --accent: #ffa64d; --accent-ink: #12112a;
  --plus: #4fd1c5; --minus: #ff9d6b; --danger: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
}
main { max-width: 520px; margin: 0 auto; padding: 20px 16px 56px; }
.display { font-family: "Bricolage Grotesque", -apple-system, "Segoe UI", Roboto, sans-serif; }
h1 { font-size: 32px; line-height: 1.05; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.02em; }

.hero { background: var(--accent); color: var(--accent-ink); border-radius: 28px; padding: 20px 22px; }
.hero .label { font-size: 15px; font-weight: 700; }
.hero .amount { font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin-top: 2px; overflow-wrap: anywhere; }
.hero .sub { font-size: 14px; font-weight: 600; margin-top: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-top: 14px; }
.card h2 { font-size: 18px; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.01em; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.field { display: flex; gap: 8px; margin-top: 10px; }
.field input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px;
}
.primary { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 13px 18px; background: var(--ink); color: var(--bg); cursor: pointer; }
.primary[disabled] { opacity: .4; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; }
.person span { padding: 8px 4px 8px 14px; font-size: 15px; font-weight: 600; }
.person button { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 6px 12px 6px 6px; cursor: pointer; line-height: 1; }
.pick {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 15px; cursor: pointer;
}
.pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lbl { font-size: 14px; font-weight: 700; margin: 14px 0 8px; }

.bal { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); gap: 12px; }
.bal:first-of-type { border-top: 0; }
.bal .n { font-weight: 600; }
.bal .v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bal .v.p { color: var(--plus); }
.bal .v.m { color: var(--minus); }
.bal .v.z { color: var(--muted); }
.pay { background: var(--bg); border-radius: 16px; padding: 12px 14px; margin-top: 8px; font-size: 16px; }
.pay b { font-variant-numeric: tabular-nums; }
.done { color: var(--plus); font-weight: 700; margin: 0; }

.exp { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.exp:first-of-type { border-top: 0; }
.exp .mid { flex: 1; min-width: 0; }
.exp .t { font-weight: 600; overflow-wrap: anywhere; }
.exp .s { font-size: 13px; color: var(--muted); }
.exp .v { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.exp .x { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--danger); font-size: 18px; cursor: pointer; line-height: 1; }
.empty { color: var(--muted); margin: 0; }
.reset { margin-top: 20px; border: 1px solid var(--danger); background: transparent; color: var(--danger); border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.note { color: var(--muted); font-size: 13px; margin-top: 18px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1 class="display">Dépenses partagées</h1>

  <section class="hero" aria-live="polite">
    <div class="label">Total dépensé</div>
    <div class="amount display" id="total">0,00 $</div>
    <div class="sub" id="totalSub"></div>
  </section>

  <section class="card">
    <h2 class="display">Qui participe ?</h2>
    <div class="chips" id="people"></div>
    <div class="field">
      <input id="personName" type="text" maxlength="24" placeholder="Prénom" aria-label="Prénom du participant" enterkeyhint="done">
      <button class="primary" id="addPerson">Ajouter</button>
    </div>
  </section>

  <section class="card" id="expCard">
    <h2 class="display">Ajouter une dépense</h2>
    <div id="expForm"></div>
  </section>

  <section class="card">
    <h2 class="display">Qui doit quoi ?</h2>
    <div id="balances"></div>
  </section>

  <section class="card">
    <h2 class="display">Historique</h2>
    <div id="history"></div>
  </section>

  <div id="resetBox"></div>
  <p class="note">Vos données restent sur cet appareil. Une seule personne saisit tout et partage le résultat aux autres.</p>
</main>

<script>
(function () {
  var KEY = "partage-v1";
  var state = { people: [], expenses: [] };
  var payer = null;
  var splitSel = {};

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.people) && Array.isArray(d.expenses)) state = d;
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function usd(cents) {
    return new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      .format(cents / 100) + "\u00a0$";
  }
  function parseCents(s) {
    var n = parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
    return isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function nameOf(id) {
    var p = state.people.filter(function (x) { return x.id === id; })[0];
    return p ? p.name : "?";
  }
  function ids() { return state.people.map(function (p) { return p.id; }); }
  function syncSelection() {
    var all = ids();
    if (all.indexOf(payer) === -1) payer = all[0] || null;
    var next = {};
    all.forEach(function (id) { next[id] = (id in splitSel) ? splitSel[id] : true; });
    splitSel = next;
  }

  // Partage en centimes : le reste est réparti un centime à la fois.
  function shares(cents, list) {
    var n = list.length, base = Math.floor(cents / n), rem = cents - base * n, out = {};
    list.forEach(function (id, i) { out[id] = base + (i < rem ? 1 : 0); });
    return out;
  }
  function balances() {
    var bal = {};
    ids().forEach(function (id) { bal[id] = 0; });
    state.expenses.forEach(function (e) {
      if (!(e.payer in bal)) return;
      var list = e.split.filter(function (id) { return id in bal; });
      if (!list.length) return;
      bal[e.payer] += e.cents;
      var s = shares(e.cents, list);
      list.forEach(function (id) { bal[id] -= s[id]; });
    });
    return bal;
  }
  function settle(bal) {
    var cr = [], db = [];
    Object.keys(bal).forEach(function (id) {
      if (bal[id] > 0) cr.push({ id: id, v: bal[id] });
      else if (bal[id] < 0) db.push({ id: id, v: -bal[id] });
    });
    cr.sort(function (a, b) { return b.v - a.v; });
    db.sort(function (a, b) { return b.v - a.v; });
    var res = [], i = 0, j = 0;
    while (i < cr.length && j < db.length) {
      var m = Math.min(cr[i].v, db[j].v);
      if (m > 0) res.push({ from: db[j].id, to: cr[i].id, v: m });
      cr[i].v -= m; db[j].v -= m;
      if (cr[i].v === 0) i++;
      if (db[j].v === 0) j++;
    }
    return res;
  }

  function renderPeople() {
    var box = document.getElementById("people");
    box.textContent = "";
    if (!state.people.length) { box.appendChild(el("p", "hint", "Ajoutez au moins 2 personnes pour commencer.")); return; }
    state.people.forEach(function (p) {
      var chip = el("span", "person");
      chip.appendChild(el("span", null, p.name));
      var x = el("button", null, "×");
      x.type = "button";
      x.setAttribute("aria-label", "Retirer " + p.name);
      x.addEventListener("click", function () {
        var used = state.expenses.some(function (e) { return e.payer === p.id || e.split.indexOf(p.id) !== -1; });
        if (used) { window.alert(p.name + " apparaît dans des dépenses. Supprimez d’abord ces dépenses."); return; }
        state.people = state.people.filter(function (q) { return q.id !== p.id; });
        save(); render();
      });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }

  function renderForm() {
    var f = document.getElementById("expForm");
    f.textContent = "";
    if (state.people.length < 2) {
      f.appendChild(el("p", "empty", "Ajoutez d’abord au moins 2 participants ci-dessus."));
      return;
    }
    f.appendChild(el("div", "lbl", "Payé par"));
    var pc = el("div", "chips");
    state.people.forEach(function (p) {
      var b = el("button", "pick", p.name);
      b.type = "button";
      b.setAttribute("aria-pressed", p.id === payer ? "true" : "false");
      b.addEventListener("click", function () { payer = p.id; renderForm(); });
      pc.appendChild(b);
    });
    f.appendChild(pc);

    f.appendChild(el("div", "lbl", "Partagé entre"));
    var sc = el("div", "chips");
    state.people.forEach(function (p) {
      var b = el("button", "pick", p.name);
      b.type = "button";
      b.setAttribute("aria-pressed", splitSel[p.id] ? "true" : "false");
      b.addEventListener("click", function () { splitSel[p.id] = !splitSel[p.id]; renderForm(); });
      sc.appendChild(b);
    });
    f.appendChild(sc);

    var row1 = el("div", "field");
    var desc = el("input"); desc.type = "text"; desc.id = "desc"; desc.maxLength = 40;
    desc.placeholder = "Ex. Restaurant"; desc.setAttribute("aria-label", "Description");
    var amt = el("input"); amt.type = "text"; amt.id = "amt"; amt.setAttribute("inputmode", "decimal");
    amt.placeholder = "Montant ($)"; amt.setAttribute("aria-label", "Montant en dollars");
    row1.appendChild(desc); row1.appendChild(amt);
    f.appendChild(row1);
    var row2 = el("div", "field");
    var add = el("button", "primary", "Ajouter la dépense");
    add.type = "button"; add.style.flex = "1";
    add.addEventListener("click", addExpense);
    row2.appendChild(add);
    f.appendChild(row2);
    amt.addEventListener("keydown", function (e) { if (e.key === "Enter") addExpense(); });
  }

  function addExpense() {
    var cents = parseCents(document.getElementById("amt").value);
    var desc = document.getElementById("desc").value.trim();
    var list = ids().filter(function (id) { return splitSel[id]; });
    if (isNaN(cents) || cents <= 0) { window.alert("Entrez un montant supérieur à 0, par exemple 45,50."); return; }
    if (!list.length) { window.alert("Choisissez au moins une personne dans « Partagé entre »."); return; }
    state.expenses.push({
      id: "e" + Date.now() + Math.floor(Math.random() * 1000),
      desc: desc || "Dépense", cents: cents, payer: payer, split: list, date: new Date().toISOString().slice(0, 10)
    });
    save(); render();
  }

  function renderBalances() {
    var box = document.getElementById("balances");
    box.textContent = "";
    if (!state.people.length) { box.appendChild(el("p", "empty", "Rien à calculer pour l’instant.")); return; }
    var bal = balances();
    state.people.forEach(function (p) {
      var row = el("div", "bal");
      row.appendChild(el("span", "n", p.name));
      var v = bal[p.id] || 0;
      var cls = v > 0 ? "p" : v < 0 ? "m" : "z";
      var txt = v > 0 ? "récupère " + usd(v) : v < 0 ? "doit " + usd(-v) : "à l’équilibre";
      row.appendChild(el("span", "v " + cls, txt));
      box.appendChild(row);
    });
    var moves = settle(bal);
    box.appendChild(el("div", "lbl", "Pour équilibrer"));
    if (!moves.length) {
      box.appendChild(el("p", "done", state.expenses.length ? "Tout est réglé." : "Aucune dépense pour l’instant."));
    } else {
      moves.forEach(function (m) {
        var d = el("div", "pay");
        d.appendChild(el("b", null, nameOf(m.from)));
        d.appendChild(document.createTextNode(" donne "));
        d.appendChild(el("b", null, usd(m.v)));
        d.appendChild(document.createTextNode(" à "));
        d.appendChild(el("b", null, nameOf(m.to)));
        box.appendChild(d);
      });
    }
  }

  function renderHistory() {
    var box = document.getElementById("history");
    box.textContent = "";
    if (!state.expenses.length) { box.appendChild(el("p", "empty", "Aucune dépense enregistrée.")); return; }
    state.expenses.slice().reverse().forEach(function (e) {
      var row = el("div", "exp");
      var mid = el("div", "mid");
      mid.appendChild(el("div", "t", e.desc));
      var who = e.split.length === state.people.length ? "tous" : e.split.map(nameOf).join(", ");
      mid.appendChild(el("div", "s", "Payé par " + nameOf(e.payer) + " · pour " + who));
      row.appendChild(mid);
      row.appendChild(el("div", "v", usd(e.cents)));
      var x = el("button", "x", "×");
      x.type = "button";
      x.setAttribute("aria-label", "Supprimer cette dépense");
      x.addEventListener("click", function () {
        if (!window.confirm("Supprimer « " + e.desc + " » (" + usd(e.cents) + ") ?")) return;
        state.expenses = state.expenses.filter(function (y) { return y.id !== e.id; });
        save(); render();
      });
      row.appendChild(x);
      box.appendChild(row);
    });
  }

  function render() {
    syncSelection();
    var total = state.expenses.reduce(function (s, e) { return s + e.cents; }, 0);
    document.getElementById("total").textContent = usd(total);
    document.getElementById("totalSub").textContent =
      state.expenses.length + (state.expenses.length > 1 ? " dépenses" : " dépense") +
      " · " + state.people.length + (state.people.length > 1 ? " personnes" : " personne");
    renderPeople();
    renderForm();
    renderBalances();
    renderHistory();
    var rb = document.getElementById("resetBox");
    rb.textContent = "";
    if (state.people.length || state.expenses.length) {
      var r = el("button", "reset", "Tout effacer et recommencer");
      r.type = "button";
      r.addEventListener("click", function () {
        if (!window.confirm("Effacer les participants et toutes les dépenses ?")) return;
        state = { people: [], expenses: [] }; splitSel = {}; payer = null;
        save(); render();
      });
      rb.appendChild(r);
    }
  }

  function addPerson() {
    var inp = document.getElementById("personName");
    var name = inp.value.trim();
    if (!name) return;
    var dup = state.people.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
    if (dup) { window.alert("« " + name + " » existe déjà. Ajoutez une initiale pour les distinguer."); return; }
    state.people.push({ id: "p" + Date.now() + Math.floor(Math.random() * 1000), name: name });
    inp.value = "";
    save(); render(); inp.focus();
  }
  document.getElementById("addPerson").addEventListener("click", addPerson);
  document.getElementById("personName").addEventListener("keydown", function (e) { if (e.key === "Enter") addPerson(); });

  load();
  render();
})();
</script>
</body>
</html>
